spring.application.name=PDFOCR
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
pdf.upload-dir=./uploads
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
paddleocr.service.url=http://localhost:5000/ocr
paddleocr.token=4c4b38d0a4840c156758662525232b781fab6335
paddleocr.models.pp-ocrv5=PP-OCRv5
paddleocr.models.pp-structurev3=PP-StructureV3
# Optional payload defaults (circuit/wiring diagram tuned, per PaddleOCR.py)
paddleocr.optional.useDocOrientationClassify=true
paddleocr.optional.useDocUnwarping=false
paddleocr.optional.useTextlineOrientation=true
paddleocr.optional.textDetLimitSideLen=960
paddleocr.optional.textDetLimitType=max
paddleocr.optional.textDetThresh=0.2
paddleocr.optional.textDetBoxThresh=0.5
paddleocr.optional.textDetUnclipRatio=2.0
paddleocr.optional.textRecScoreThresh=0.3
pdf.image.dpi=200
